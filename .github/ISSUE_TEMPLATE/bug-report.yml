name: Bug Report
description: Report a code bug in spgloader (no artifact bundle needed).
title: "[Bug] <one line summary>"
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - convert_objects.py
        - repair_procedures.py
        - deploy_tables_spg.py
        - deploy_views.py / deploy_functions.py / deploy_procedures.py
        - parallel_deploy.py
        - fix_views.py / fix_functions.py / fix_procedures.py
        - html_report.py / generate_report.py
        - collect_artifacts.py
        - SKILL.md / sub-skill
        - plpgsql-fixes.yaml / rules
        - Other
    validations:
      required: true

  - type: dropdown
    id: source_type
    attributes:
      label: Source type (if applicable)
      options:
        - mssql
        - mysql
        - mariadb
        - oracle
        - all / not source-specific
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Include the full error message and traceback if available.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run Phase X with source type Y
        2. Object type Z fails with error ...
    validations:
      required: true

  - type: input
    id: skill_version
    attributes:
      label: Skill version (git SHA)
      placeholder: "e.g. e293450 — run: git log --oneline -1"
    validations:
      required: false
