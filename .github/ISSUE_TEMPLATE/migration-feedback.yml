name: Migration Feedback
description: Report the outcome of a migration run — attach your artifact bundle for analysis.
title: "[Feedback] <source-type> migration — <one line summary>"
labels: ["feedback", "migration-run"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing spgloader. Please fill in the fields below and attach
        your artifact bundle (generated by `scripts/collect_artifacts.py`).

        **Before submitting**: Run the collector to strip sensitive data:
        ```bash
        uv run --project <SKILL_DIR> python <SKILL_DIR>/scripts/collect_artifacts.py \
          --work-dir ~/.spgloader/<your-run-dir> \
          --output ~/Desktop/spgloader_feedback.zip
        ```

  - type: dropdown
    id: source_type
    attributes:
      label: Source database type
      options:
        - mssql (SQL Server)
        - mysql
        - mariadb
        - oracle
        - ddl-file (schema-only)
    validations:
      required: true

  - type: input
    id: source_version
    attributes:
      label: Source version
      placeholder: "e.g. SQL Server 2022, MySQL 8.0, Oracle 19c"
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase where the issue occurred
      options:
        - Phase 1 — Source setup / DDL extract
        - Phase 2 — Assessment
        - Phase 3 — Convert objects
        - Phase 4 — Deploy (tables / views / functions)
        - Phase 5 — Repair (LLM repair loop)
        - Phase 6 — Validate
        - Phase 6.5 — Witness validation
        - Phase 6.6 — Parity testing
        - Report generation
        - Multiple phases
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What went wrong
      description: Describe the failure — paste any error messages here.
      placeholder: |
        e.g. 14 stored procedures still fail after LLM repair with:
        "column SalesYear does not exist"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: e.g. All procedures should have been repaired by the LLM loop.

  - type: checkboxes
    id: artifact_attached
    attributes:
      label: Artifact bundle
      options:
        - label: >
            I have attached `spgloader_feedback_*.zip` (generated by
            `collect_artifacts.py`) to this issue.
          required: true

  - type: input
    id: skill_version
    attributes:
      label: Skill version (git SHA)
      description: Found in `metadata.json` inside the zip, or run `git log --oneline -1` in the skill repo.
      placeholder: "e.g. e293450"
