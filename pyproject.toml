[project]
name = "spgloader"
version = "0.1.0"
description = "Multi-source to Snowflake Postgres migration skill (MSSQL, MySQL, Oracle)"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyodbc>=5.1",
    "mysql-connector-python>=9.0",
    "oracledb>=2.0",
    "tabulate>=0.9.0",
    "pymssql>=2.3.13",
    "snowflake-connector-python>=4.7.1",
    "faker>=24.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "lib"]
