# plpgsql-fixes.yaml
# ---------------------------------------------------------------------------
# Rule-based PL/pgSQL body transformation rules.
#
# Applied by scripts/fix_functions.py to converted function/procedure files.
# Rules complement the generic type and function substitutions in
# references/rules/mssql-to-pg/function-substitutions.yaml — those apply
# during the initial conversion pass; these apply as a post-conversion fix.
#
# Fields (same schema as function-substitutions.yaml):
#   name         : Short identifier used in fix reports.
#   description  : Human-readable explanation.
#   pattern      : Python regex (single-quoted).
#   replacement  : Replacement string. Backreferences: \1, \2, etc.
#   flags        : List of re flags (default: [IGNORECASE]).
#   enabled      : false = handled in Python code, not as a regex.
#   note         : Optional extra context.
# ---------------------------------------------------------------------------

body_transforms:

  # ── Variable assignment ───────────────────────────────────────────────────

  - name:        set_variable_assign
    description: "SET var = expr → var := expr  (single-variable assignment)"
    # Covers the residual SET assignments not caught in the first conversion pass.
    pattern:     '\bSET\s+(\w+)\s*='
    replacement: '\1 :='
    flags:       [IGNORECASE]

  - name:        select_assign_single_from
    description: "SELECT var = expr FROM table → SELECT expr INTO var FROM table"
    # T-SQL: SELECT @x = col FROM t WHERE ...
    # Handles single-variable case with FROM clause.
    # Multi-variable case is handled structurally in Python (select_assign_multi pass).
    pattern:     '\bSELECT\s+(\w+)\s*=\s*([^,\n]+?)\s+FROM\b'
    replacement: 'SELECT \2 INTO \1 FROM'
    flags:       [IGNORECASE]

  - name:        select_assign_single_nofrom
    description: "SELECT var = expr  (no FROM) → var := expr"
    # T-SQL: SELECT @TotalDays = DATEDIFF(Day, @MonthStart, @MonthEnd)
    pattern:     '\bSELECT\s+(\w+)\s*=\s*([^,\n;]+?)\s*;'
    replacement: '\1 := \2;'
    flags:       [IGNORECASE]

  # ── Control-flow fixes ────────────────────────────────────────────────────

  - name:        else_if_to_elsif
    description: "ELSE IF → ELSIF  (PL/pgSQL does not use ELSE IF)"
    pattern:     '\bELSE\s+IF\b'
    replacement: 'ELSIF'
    flags:       [IGNORECASE]

  - name:        if_no_then
    description: "IF condition\\n    action  →  IF condition THEN\\n    action"
    # Catches single-statement IF without THEN on the same line.
    # Already partially handled in convert_function, but may miss edge cases.
    # Negative lookbehind ensures we don't add THEN if line already ends with it.
    pattern:     '\bIF\s+([^\n]+?(?<!\bTHEN))\n(\s+)(?!THEN|--|\()'
    replacement: 'IF \1 THEN\n\2'
    flags:       [IGNORECASE]

  - name:        dedupe_then
    description: "IF ... THEN THEN  →  IF ... THEN  (remove accidental duplicate THEN)"
    pattern:     '\bTHEN\s+THEN\b'
    replacement: 'THEN'
    flags:       [IGNORECASE]

  - name:        dedupe_then_semicolon
    description: "THEN; THEN / THEN; THEN; → THEN (rule cascade artifact)"
    pattern:     '\bTHEN\s*;+\s*THEN\b'
    replacement: 'THEN'
    flags:       [IGNORECASE]

  - name:        while_no_loop
    description: "WHILE condition\\n    action → WHILE condition LOOP\\n    action"
    # Single-statement WHILE body without LOOP keyword.
    pattern:     '\bWHILE\s+([^\n]+)\n(\s+)(?!LOOP|--)'
    replacement: 'WHILE \1 LOOP\n\2'
    flags:       [IGNORECASE]

  - name:        dedupe_loop
    description: "LOOP LOOP  →  LOOP  (remove accidental duplicate LOOP)"
    pattern:     '\bLOOP\s+LOOP\b'
    replacement: 'LOOP'
    flags:       [IGNORECASE]

  - name:        readonly_param
    description: "READONLY / READ ONLY → (removed)  (T-SQL UDTT param keyword not valid in PG)"
    pattern:     '\s+(?:READONLY|READ\s+ONLY)\b'
    replacement: ''
    flags:       [IGNORECASE]

  - name:        semicolon_after_select_into
    description: "SELECT ... INTO ... (no ;) then new statement → add ;"
    # Targets only SELECT INTO lines that are missing their trailing semicolon.
    # These are multi-line statements where the WHERE clause ends the SELECT.
    # Only fires when the NEXT line starts a new PL/pgSQL statement.
    pattern:     '(SELECT[^\n]+\bINTO\b[^\n]+\b\w+)([ \t\n]+)(\w+\s*:=|\bELSE\b|\bELSIF\b|\bEND\s+IF\b|\bEND\s+LOOP\b|\bRETURN\b)'
    replacement: '\1;\n\3'
    flags:       [IGNORECASE]

  - name:        semicolon_before_else
    description: "statement ELSE → statement; ELSE  (PL/pgSQL needs ; before ELSE)"
    # Handles multiple newlines and tabs between statement and ELSE/ELSIF.
    pattern:     '([^\s;])([ \t\n]*)(ELSE|ELSIF)\b'
    replacement: '\1;\n\3'
    flags:       [IGNORECASE]

  - name:        semicolon_before_assignment
    description: "closing ) then assignment  →  add ; after )"
    pattern:     '\)([ \t\n]*)(\w+\s*:=)'
    replacement: ');\n\2'
    flags:       [IGNORECASE]

  - name:        semicolon_before_end_if
    description: "closing ) then END IF  →  add ;"
    pattern:     '\)([ \t\n]*)(END\s+IF\b)'
    replacement: ');\n\2'
    flags:       [IGNORECASE]

  - name:        semicolon_before_return
    description: "unclosed statement before RETURN → add ;"
    pattern:     '\)([ \t\n]*)(RETURN\b)'
    replacement: ');\n\2'
    flags:       [IGNORECASE]

  # ── DATEPART / DATEADD in function bodies ────────────────────────────────

  - name:        datepart_hour
    description: "DATEPART(HOUR, expr) → EXTRACT(HOUR FROM expr)"
    pattern:     '\bDATEPART\s*\(\s*(?:HOUR|HH)\s*,\s*([^)]+)\)'
    replacement: 'EXTRACT(HOUR FROM \1)'
    flags:       [IGNORECASE]

  - name:        datepart_minute
    description: "DATEPART(MINUTE, expr) → EXTRACT(MINUTE FROM expr)"
    pattern:     '\bDATEPART\s*\(\s*(?:MINUTE|MI|N)\s*,\s*([^)]+)\)'
    replacement: 'EXTRACT(MINUTE FROM \1)'
    flags:       [IGNORECASE]

  - name:        datepart_year
    description: "DATEPART(YEAR/YY/YYYY, expr) → EXTRACT(YEAR FROM expr)"
    pattern:     '\bDATEPART\s*\(\s*(?:YEAR|YY|YYYY)\s*,\s*([^)]+)\)'
    replacement: 'EXTRACT(YEAR FROM \1)'
    flags:       [IGNORECASE]

  - name:        datepart_month
    description: "DATEPART(MONTH/MM/M, expr) → EXTRACT(MONTH FROM expr)"
    pattern:     '\bDATEPART\s*\(\s*(?:MONTH|MM|M)\s*,\s*([^)]+)\)'
    replacement: 'EXTRACT(MONTH FROM \1)'
    flags:       [IGNORECASE]

  - name:        dateadd_hour
    description: "DATEADD(HOUR, n, expr) → expr + n * INTERVAL '1 hour'"
    pattern:     '\bDATEADD\s*\(\s*(?:HOUR|HH)\s*,\s*(-?\s*\d+|\w+(?:\.\w+)*)\s*,\s*([^)]+)\)'
    replacement: '(\2 + (\1) * INTERVAL ''1 hour'')'
    flags:       [IGNORECASE]

  - name:        dateadd_minute
    description: "DATEADD(MINUTE, n, expr) → expr + n * INTERVAL '1 minute'"
    pattern:     '\bDATEADD\s*\(\s*(?:MINUTE|MI|N)\s*,\s*(-?\s*\d+|\w+(?:\.\w+)*)\s*,\s*([^)]+)\)'
    replacement: '(\2 + (\1) * INTERVAL ''1 minute'')'
    flags:       [IGNORECASE]

  - name:        dateadd_day
    description: "DATEADD(DAY, n, expr) → expr + n * INTERVAL '1 day'"
    pattern:     '\bDATEADD\s*\(\s*(?:DAY|DD|D)\s*,\s*(-?\s*\d+|\w+(?:\.\w+)*)\s*,\s*([^)]+)\)'
    replacement: '(\2 + (\1) * INTERVAL ''1 day'')'
    flags:       [IGNORECASE]

  - name:        dateadd_month
    description: "DATEADD(MONTH, n, expr) → expr + n * INTERVAL '1 month'"
    pattern:     '\bDATEADD\s*\(\s*(?:MONTH|MM|M)\s*,\s*(-?\s*\d+|\w+(?:\.\w+)*)\s*,\s*([^)]+)\)'
    replacement: '(\2 + (\1) * INTERVAL ''1 month'')'
    flags:       [IGNORECASE]

  - name:        dateadd_year
    description: "DATEADD(YEAR, n, expr) → expr + n * INTERVAL '1 year'"
    pattern:     '\bDATEADD\s*\(\s*(?:YEAR|YY|YYYY)\s*,\s*(-?\s*\d+|\w+(?:\.\w+)*)\s*,\s*([^)]+)\)'
    replacement: '(\2 + (\1) * INTERVAL ''1 year'')'
    flags:       [IGNORECASE]

  # ── String / utility function fixes ──────────────────────────────────────

  - name:        ltrim_rtrim_to_btrim
    description: "LTRIM(RTRIM(x)) → BTRIM(x)"
    pattern:     '\bLTRIM\s*\(\s*RTRIM\s*\(([^)]+)\)\s*\)'
    replacement: 'BTRIM(\1)'
    flags:       [IGNORECASE]

  - name:        rtrim_ltrim_to_btrim
    description: "RTRIM(LTRIM(x)) → BTRIM(x)"
    pattern:     '\bRTRIM\s*\(\s*LTRIM\s*\(([^)]+)\)\s*\)'
    replacement: 'BTRIM(\1)'
    flags:       [IGNORECASE]

  - name:        return_without_semicolon
    description: "RETURN expr  →  RETURN expr; (add trailing semicolon if missing)"
    pattern:     '\bRETURN\s+(\S[^\n;]*[^\s;])\s*\n'
    replacement: 'RETURN \1;\n'
    flags:       [IGNORECASE]

  # ── Schema prefix for table references inside function bodies ────────────
  # (Applied using the schema_prefix rules from view-fixes.yaml / project config)
  - name:        schema_prefix
    description: "Unqualified table references in FROM/JOIN → add schema prefix"
    enabled:     false  # handled by fix_functions.py using project view-fixes.yaml

  # ── Procedure-specific rules ──────────────────────────────────────────────
  # These are not safe to apply to functions (different RETURN semantics) but
  # are correct for stored procedures.  fix_procedures.py passes procedure=true.

  - name:        sysname_to_text
    description: "SQL Server 'sysname' type → text  (PG has no sysname)"
    pattern:     '\bsysname\b'
    replacement: 'text'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        exec_noargs_to_ewi
    description: "EXEC procname; (no args) → EWI comment stub"
    pattern:     '\bEXEC\s+(?:\w+\.)?\s*(\w+)\s*;'
    replacement: '-- SPG-EWI: EXEC \1(); — manual CALL conversion needed\n    CALL \1();'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        bool_assign_zero
    description: "transtarted/currentpos_bool := 0 → false (bit vars that become boolean)"
    # transtarted is always BIT (DECLARE @tranStarted BIT); 0 = not started
    pattern:     '\b(transtarted|isanonymous)\s*:=\s*0\b'
    replacement: '\1 := false'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        bool_assign_one
    description: "transtarted := 1 → true"
    pattern:     '\b(transtarted|isanonymous)\s*:=\s*1\b'
    replacement: '\1 := true'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        if_paren_no_space_then
    description: "IF(cond) THEN — IF without space before paren is valid PL/pgSQL; no fix needed"
    # This rule is intentionally empty — IF(cond) THEN is valid PL/pgSQL syntax
    enabled:     false
    pattern:     ''
    replacement: ''
    procedure_only: true

  - name:        nolock_hint
    description: "(NOLOCK) / (NOLOCK, ...) table hint in FROM/JOIN → remove"
    pattern:     '\s*\(\s*NOLOCK\s*\)'
    replacement: ''
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        return_value_in_parens
    description: "RETURN(expr) → RETURN; — SQL Server allows RETURN(value), PG procedures cannot"
    pattern:     '\bRETURN\s*\(\s*\w+\s*\)\s*;?'
    replacement: 'RETURN;'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        double_select_into_semicolon
    description: "Two consecutive SELECT…INTO lines without ; between → insert semicolon"
    # Pattern: SELECT ... INTO var (no ;) followed immediately by SELECT
    pattern:     '(\bSELECT\b[^\n]+\bINTO\b[^\n]+)\n(\s*\bSELECT\b)'
    replacement: '\1;\n\2'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        at_rowcount_residual
    description: "Residual @rowcount that was not lowercased → _row_count"
    pattern:     '@rowcount\b'
    replacement: '_row_count'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        forceseek_hint
    description: "WITH (FORCESEEK) / (FORCESCAN) table hints → remove"
    pattern:     '\s*WITH\s*\(\s*FORCE(?:SEEK|SCAN)\s*\)'
    replacement: ''
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        cross_apply_to_lateral
    description: "CROSS APPLY → CROSS JOIN LATERAL (not handled by preprocess in proc bodies)"
    pattern:     '\bCROSS\s+APPLY\b'
    replacement: 'CROSS JOIN LATERAL'
    flags:       [IGNORECASE]
    procedure_only: true

  - name:        outer_apply_to_lateral
    description: "OUTER APPLY → LEFT JOIN LATERAL"
    pattern:     '\bOUTER\s+APPLY\b'
    replacement: 'LEFT JOIN LATERAL'
    flags:       [IGNORECASE]
    procedure_only: true

  # ── Type fixes ────────────────────────────────────────────────────────────

  - name:        text_with_size
    description: "TEXT(n) → TEXT  (PostgreSQL TEXT has no length modifier)"
    pattern:     '\bTEXT\s*\(\s*\d+\s*\)'
    replacement: 'TEXT'
    flags:       [IGNORECASE]

  - name:        varchar_with_max
    description: "VARCHAR(MAX) → TEXT"
    pattern:     '\bVARCHAR\s*\(\s*MAX\s*\)'
    replacement: 'TEXT'
    flags:       [IGNORECASE]

  - name:        nvarchar_with_max
    description: "NVARCHAR(MAX) → TEXT"
    pattern:     '\bNVARCHAR\s*\(\s*MAX\s*\)'
    replacement: 'TEXT'
    flags:       [IGNORECASE]

  - name:        convert_to_cast
    description: "CONVERT(type, expr) → CAST(expr AS type)"
    # Handles CONVERT(VARCHAR(100), expr) and CONVERT(INT, expr)
    pattern:     '\bCONVERT\s*\(\s*([\w\s()]+?)\s*,\s*([^)]+?)\s*\)'
    replacement: 'CAST(\2 AS \1)'
    flags:       [IGNORECASE]

  # ── String concatenation ──────────────────────────────────────────────────

  - name:        plus_concat_after_pipe
    description: "expr || 'x' + 'y' → expr || 'x' || 'y'  (mixed + and || concat)"
    # After || there should be no + for string concat
    pattern:     '(\|\|[^+\n]*)\x27([^\x27]*)\x27\s*\+'
    replacement: '\1''\2'' ||'
    flags:       [IGNORECASE]

  # ── DML fixes ─────────────────────────────────────────────────────────────

  - name:        insert_missing_into
    description: "INSERT table → INSERT INTO table  (INTO is required in PL/pgSQL)"
    pattern:     '\bINSERT\s+(?!INTO\b)(\w)'
    replacement: 'INSERT INTO \1'
    flags:       [IGNORECASE]

  - name:        update_missing_set
    description: "UPDATE tbl\\ncol := val → UPDATE tbl SET col = val"
    # Catches UPDATE immediately followed by a column assignment on next line
    pattern:     '(\bUPDATE\b[^\n]+)\n(\s+)(\w+)\s*:='
    replacement: '\1\n\2SET \3 ='
    flags:       [IGNORECASE]

  # ── Locking hints ─────────────────────────────────────────────────────────

  - name:        mssql_locking_hints
    description: "WITH (ROWLOCK/UPDLOCK/HOLDLOCK/XLOCK/TABLOCK) → remove"
    pattern:     '\s*WITH\s*\(\s*(?:ROW|UPD|HOLD|X|PAGE|TAB)LOCK[^)]*\)'
    replacement: ''
    flags:       [IGNORECASE]

  # ── DDL fixes in procedure bodies ─────────────────────────────────────────

  - name:        nonclustered_index
    description: "CREATE NONCLUSTERED INDEX → CREATE INDEX"
    pattern:     '\bCREATE\s+NONCLUSTERED\s+INDEX\b'
    replacement: 'CREATE INDEX'
    flags:       [IGNORECASE]

  - name:        clustered_index
    description: "CREATE CLUSTERED INDEX → CREATE INDEX"
    pattern:     '\bCREATE\s+CLUSTERED\s+INDEX\b'
    replacement: 'CREATE INDEX'
    flags:       [IGNORECASE]

  - name:        trailing_comma_before_close_paren
    description: "trailing comma before ) in CREATE TABLE → remove"
    pattern:     ',(\s*\n\s*\))'
    replacement: '\1'
    flags:       [IGNORECASE]

  - name:        three_part_object_name
    description: "database.schema.table → schema.table (cross-db refs not supported)"
    pattern:     '\b(\w+)\.(dbo|schema)\.'
    replacement: '\2.'
    flags:       [IGNORECASE]

  - name:        option_maxrecursion
    description: "OPTION (MaxRecursion N); → remove (SQL Server query hint)"
    pattern:     '\n[^\n]*OPTION\s*\(\s*MaxRecursion\s+\d+\s*\)\s*;?'
    replacement: ''
    flags:       [IGNORECASE]

  - name:        semicolon_inside_case
    description: "THEN value; inside CASE...END → remove the semicolon"
    # Semicolons inside CASE expressions break PL/pgSQL parsing
    pattern:     '(\bTHEN\b\s+\w+)\s*;(\s*(?:WHEN|ELSE|END)\b)'
    replacement: '\1\2'
    flags:       [IGNORECASE]

  - name:        standalone_transaction_keyword
    description: "Bare TRANSACTION line (leftover from BEGIN TRANSACTION) → remove"
    pattern:     '\n[ \t]*TRANSACTION[ \t]*\n'
    replacement: '\n'
    flags:       [IGNORECASE]

  # ── IF BEGIN/END block conversion ─────────────────────────────────────────

  - name:        if_begin_to_then
    description: "IF (cond) BEGIN → IF cond THEN  (T-SQL block → PL/pgSQL)"
    # Matches IF (...) BEGIN or IF ... BEGIN (with or without parens)
    pattern:     '\bIF\s*\(([^)]+)\)\s*\n\s*BEGIN\b'
    replacement: 'IF \1 THEN'
    flags:       [IGNORECASE]

  - name:        standalone_begin_to_nothing
    description: "Standalone BEGIN (not BEGIN...END of func) after IF THEN → remove"
    # Leftover BEGIN lines after if_begin_to_then fires
    pattern:     '(\bIF\b[^\n]+THEN\b[^\n]*\n)(\s*)BEGIN\s*\n'
    replacement: '\1'
    flags:       [IGNORECASE]

  - name:        standalone_end_to_end_if
    description: "Standalone END; after an IF body → END IF;"
    # A bare END; after IF body where there's no matching BEGIN (already removed)
    pattern:     '\n(\s*)END\s*;\s*\n(\s*)(ELSE|ELSIF|ELSEIF)\b'
    replacement: '\n\1END IF;\n\2\3'
    flags:       [IGNORECASE]

  # ── Trailing comma/semicolon in DECLARE ───────────────────────────────────

  - name:        declare_trailing_comma_semicolon
    description: "var type = val,; → var type := val;  (trailing ,; in DECLARE)"
    pattern:     ',\s*;'
    replacement: ';'
    flags:       [IGNORECASE]

  - name:        incomplete_declare_value
    description: "var TYPE :=; → var TYPE := 0;  (missing value in declaration)"
    pattern:     '(:?=\s*;)'
    replacement: ':= 0;'
    flags:       [IGNORECASE]


  # ── View-specific SQL fixes (view_only: true) ─────────────────────────────
  # Applied by fix_views.py when processing converted view SQL files.

  - name:        string_plus_to_concat
    description: "expr + expr → expr || expr  (T-SQL + used as string concat in view SELECT)"
    # Handles: END + CASE, 'str' + expr, expr + 'str' in SELECT context
    pattern:     '(\bEND\b)\s*\+\s*(\bCASE\b)'
    replacement: '\1 || \2'
    flags:       [IGNORECASE]
    view_only:   true

  - name:        boolean_eq_one_in_where
    description: "boolean_col = 1 → boolean_col = true  (BIT column comparison in WHERE)"
    pattern:     '\b(\w+)\s*=\s*1\b(?!\s*\)?\s*(?:THEN|AND|OR|;|$))'
    replacement: '\1 = true'
    flags:       [IGNORECASE]
    view_only:   true

  - name:        timestamp_neq_empty_string
    description: "timestamp_col <> '' → timestamp_col IS NOT NULL  (T-SQL temporal null check)"
    pattern:     "(\\.?\\w+)\\s*<>\\s*''"
    replacement: '\1 IS NOT NULL'
    flags:       [IGNORECASE]
    view_only:   true

  - name:        lateral_join_add_on_true
    description: "LEFT JOIN LATERAL (...) alias → add ON true (required in PostgreSQL)"
    # Matches a closing paren + alias without ON clause before FROM or WHERE
    pattern:     '(\)\s+(?:AS\s+)?\w+)(\s*\n\s*(?:WHERE|LEFT|INNER|CROSS|,|\s*$))'
    replacement: '\1 ON true\2'
    flags:       [IGNORECASE]
    view_only:   true

  - name:        derived_table_spurious_on_true
    description: "( subquery ) alias ON true → ( subquery ) alias  (plain FROM subquery, not a JOIN)"
    # Removes ON true from a derived table that is the sole FROM source (not a JOIN)
    pattern:     '(\)\s+\w+)\s+ON\s+true(\s*\n\s*WHERE)'
    replacement: '\1\2'
    flags:       [IGNORECASE]
    view_only:   true


  # ── New rules from migration analysis ────────────────────────────────────

  - name:        if_update_col
    description: "IF UPDATE(col) → IF TG_OP = 'UPDATE' AND NEW.col IS DISTINCT FROM OLD.col  (T-SQL trigger per-column change check)"
    pattern:     '\bIF\s+UPDATE\s*\(\s*(\w+)\s*\)'
    replacement: "IF TG_OP = 'UPDATE' AND NEW.\\1 IS DISTINCT FROM OLD.\\1"
    flags:       [IGNORECASE]

  - name:        dedupe_cast_text
    description: "CAST(CAST(expr AS TEXT) AS TEXT) → CAST(expr AS TEXT)  (redundant nested CAST from multi-pass conversion)"
    pattern:     '\bCAST\s*\(\s*CAST\s*\(\s*([^()]+)\s+AS\s+TEXT\s*\)\s+AS\s+TEXT\s*\)'
    replacement: 'CAST(\1 AS TEXT)'
    flags:       [IGNORECASE]
