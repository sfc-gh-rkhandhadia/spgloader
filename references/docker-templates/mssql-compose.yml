services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spgloader_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    # Mount mssql.conf to disable forced encryption so pgloader's TDS client
    # (which does not negotiate SQL Server TLS) can connect.
    volumes:
      - ./mssql-init.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "${MSSQL_SA_PASSWORD}"
        - -Q
        - "SELECT 1"
        - -No
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s

