services:
  oracle:
    # Oracle Database Free 23c — free tier, no license required.
    # Requires authentication: docker login container-registry.oracle.com
    image: container-registry.oracle.com/database/free:latest
    container_name: spgloader_oracle
    environment:
      ORACLE_PWD: "${ORACLE_PWD}"
    ports:
      - "1521:1521"
    # Oracle Free uses a built-in healthcheck script
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    # Shared memory required for Oracle
    shm_size: 1g
