# view-fixes.yaml
# ---------------------------------------------------------------------------
# Generic mapping document for view conversion corrections.
# Consumed by scripts/fix_views.py — edit this file to customise fixes
# for a specific migration project.
#
# ALL project-specific names (table names, column aliases, cross-db prefixes)
# are intentionally absent.  The schema prefix section uses auto-detection
# so no table name list is required.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# SECTION 1 — Schema prefix
# Controls how fix_views.py adds the target schema qualifier to unqualified
# table references in FROM and JOIN clauses.
#
# auto_detect: true  — derive unqualified references automatically from
#                      ddl_objects.json (the workspace's extracted catalog).
#                      No table name list is needed; works for any project.
#
# extra_tables: []   — optional explicit table names to always prefix, on top
#                      of auto-detection (e.g. views or synonyms not in the DDL).
#
# Note: schema name is NOT set here.  It is derived from ddl_objects.json by
# deploy_views.py and fix_views.py at runtime.
# ---------------------------------------------------------------------------
schema_prefix:
  auto_detect: true
  extra_tables: []

# ---------------------------------------------------------------------------
# SECTION 2 — Cross-database remaps
# SQL Server allows three-part db.schema.table references.
# PostgreSQL does not support cross-database references.
# Add project-specific entries here to strip a foreign-db prefix and map it
# to the local schema.
#
# Example:
#   - from_prefix: "external_db.dbo."
#     to_prefix:   "local_schema."
# ---------------------------------------------------------------------------
cross_db_remaps: []
# Add project-specific entries at migration time, e.g.:
#   - from_prefix: "source_db.dbo."
#     to_prefix:   "dbo."

# ---------------------------------------------------------------------------
# SECTION 3 — Pattern-based fixes
# Applied to every view file.  All flags below are source-agnostic and safe
# to enable for any T-SQL → PostgreSQL migration.
# ---------------------------------------------------------------------------
pattern_fixes:
  # T-SQL:   col AS 'Alias'  →  col AS lowercased_alias (plain identifier)
  single_quoted_alias: true

  # T-SQL:   alias = expression  (column alias on left of =, at line start)
  # PG:      expression AS alias
  column_equals_alias: true

  # T-SQL alias = expr embedded in the middle of a SELECT line (after comma)
  embedded_column_equals_alias: true

  # Multi-word unquoted column aliases — uses known_multi_word_aliases list below.
  # Leave false unless you add entries to known_multi_word_aliases.
  multi_word_alias: false

  # T-SQL TOP N was converted to LIMIT but the number was lost → bare LIMIT
  bare_limit: true

  # T-SQL string concatenation: expr + 'str'  →  expr || 'str'
  tsql_string_concat: true

  # CAST(convert(date,NOW( AS TEXT))) → CURRENT_DATE
  now_date_cast: true

  # DatePart(yyyy/year/month/..., expr) → EXTRACT(unit FROM expr)
  datepart: true

  # DATEADD(UNIT, N, expr) → (expr + N * INTERVAL '1 unit')
  dateadd: true

  # CONVERT(VarChar(N), expr) → CAST(expr AS VARCHAR(N))
  convert_typed: true

  # CAST(expr,NNN AS TEXT) → CAST(expr AS DATE)
  cast_format_code: true

  # CAST(DATEDIFF(unit, a, b AS TEXT)) → numeric epoch expression
  datediff_in_cast: true

  # objectkey_cast: disabled by default; enable and list id_cols only if the
  # project has a VARCHAR ObjectKey column compared to integer IDs.
  objectkey_cast: false
  objectkey_cast_id_cols: []

  # NOW() - integer → NOW() - INTERVAL 'N days'
  now_minus_int: true

  # CURRENT_TIMESTAMP - integer → CURRENT_TIMESTAMP - INTERVAL 'N days'
  current_timestamp_minus_int: true

  # DATEADD(unit, DATEDIFF(unit, 0, expr) [+/- N], 0) → DATE_TRUNC + offset
  datetrunc_idiom: true

  # EOMONTH(expr) → end-of-month date expression
  eomonth: true

  # CAST(date_expr - date_expr AS REAL/FLOAT) → epoch-based numeric
  cast_interval_to_numeric: true

  # DATALENGTH(expr) → OCTET_LENGTH(expr)
  datalength: true

  # Replace NOW() with CURRENT_TIMESTAMP for DATEADD regex compatibility
  now_to_current_timestamp: true

# ---------------------------------------------------------------------------
# SECTION 3b — Explicit multi-word column alias list
# Only needed when multi_word_alias is true.
# Add project-specific multi-word aliases that appear in your views.
# ---------------------------------------------------------------------------
known_multi_word_aliases: []

# ---------------------------------------------------------------------------
# SECTION 4 — PIVOT conversion
# When a view contains the PIVOT keyword, fix_views.py converts it to a
# PostgreSQL CTE + FILTER aggregate pattern.
#
# agg_function and value_column / key_column are required.
# group_by_cols and inner_tables are auto-detected from the inner SELECT —
# leave them empty unless auto-detection fails for your project.
# ---------------------------------------------------------------------------
pivot_rules:
  # Aggregate function used in the PIVOT clause (e.g. MAX, SUM, COUNT)
  agg_function: MAX

  # Column whose distinct values become output columns (the "key" in PIVOT)
  key_column: ""

  # Column whose values are aggregated (the "value" in PIVOT)
  value_column: ""

  # Override grouping columns (empty = auto-detect from inner SELECT)
  group_by_cols: []

  # Override inner query table names (empty = auto-detect)
  inner_tables: {}
