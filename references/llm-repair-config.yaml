# llm-repair-config.yaml
# ---------------------------------------------------------------------------
# Configuration for the LLM procedure repair loop in repair_procedures.py.
# Edit this file to tune model, iterations, workers, and Snowflake connection
# without touching the Python code.
# ---------------------------------------------------------------------------

# Snowflake Cortex model to use for code repair.
# Available models (subject to Cortex availability in your region):
#   llama3.3-70b      — fast, cost-effective, good for structured code tasks
#   mistral-large2    — strong reasoning, larger context window
#   claude-3-5-sonnet — best code generation quality, higher cost
model: claude-sonnet-4-5

# Maximum number of LLM repair iterations per failed procedure.
# After max_iterations the last LLM output is written to
# wave_4_procedures_llm_review/ for manual inspection.
max_iterations: 2

# LLM temperature (0.0 = deterministic, 1.0 = creative).
# Keep low for code generation to get consistent, compilable output.
temperature: 0.1

# Maximum tokens the LLM may return per procedure.
max_tokens: 4096

# Number of parallel repair workers.
# Each worker opens its own Snowflake + SPG connection and repairs
# one procedure at a time. Set to CPU count or Cortex concurrency limit.
# 1 = sequential (slow), 8 = good balance for interactive sessions.
workers: 8

# How often (in seconds) to print the in-progress status line:
#   [Status 1:20]  Fixed: 22  Failed so far: 1  Remaining: 74/97
# Lower values give tighter feedback; higher values reduce noise.
# With workers >= 4, 15-20s is a good balance.
progress_interval: 20

# Snowflake connection name from ~/.snowflake/connections.toml.
# Leave empty to use the default connection.
snowflake_connection: "sfsenorthamerica-rkhandhadia-aws1-pat"

# Warehouse to use for Cortex calls.
warehouse: "COMPUTE_WH"

# Prompt template file relative to the skill's references/prompts/ directory.
# Used for MSSQL / MySQL sources.
prompt_template: "procedure-repair-prompt.md"

# Prompt template used when --source-type oracle is specified.
oracle_prompt_template: "procedure-repair-oracle-prompt.md"

# When true, write each LLM attempt to the workspace for debugging even if
# the procedure eventually succeeds.
debug_llm_output: false
